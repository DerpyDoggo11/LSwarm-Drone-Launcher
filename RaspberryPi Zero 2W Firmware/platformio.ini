; LSwarm Drone Launcher — Raspberry Pi Zero 2 W central-compute firmware
;
; The Pi Zero 2 W runs Linux, so this is a PlatformIO `native` project: it is
; compiled ON the Pi (or any Linux host) with the system g++ and runs as a
; normal executable. Same Arduino-style setup()/loop() source shape as the
; ESP32 side, via the shim in include/arduino_compat.h.
;
;   pio run                     -> builds .pio/build/pizero/program
;   .pio/build/pizero/program   -> run it (default port /dev/ttyACM0)

[env:pizero]
platform = native
build_flags =
    -std=c++17
    -O2
    -Wall
    -Iinclude
build_src_filter = +<*>
