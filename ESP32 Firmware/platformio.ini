; LSwarm Drone Launcher — ESP32-C3 power/status co-processor firmware
; MCU: ESP32-C3-MINI-1U-N4 (4 MB flash), native USB CDC to the Raspberry Pi.

[env:esp32c3]
platform  = espressif32
board     = esp32-c3-devkitm-1     ; ESP32-C3, 4 MB flash — matches the -N4 module
framework = arduino

; Native USB acts as the serial link (and the programming/monitor port).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
; Uncomment and set once you know the enumerated port to pin uploads/monitor:
; upload_port  = COM5
; monitor_port = COM5
